[workspace]
members = ["crates/core", "crates/app"]
resolver = "2"

[workspace.package]
version = "0.2.0"
edition = "2021"
license = "MIT"
authors = ["Mojuan"]

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = "z"      # 极致体积（z 比 s 再省一档）
lto = "fat"          # 全程序 LTO，跨 crate 死代码消除
codegen-units = 1
panic = "abort"
strip = "symbols"
debug = false
