[package]
name = "mojuan"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "墨卷 · 纯 Rust 的 Markdown 阅读与编辑器"

[[bin]]
name = "mojuan"
path = "src/main.rs"

[build-dependencies]
winresource = "0.1"

# Linux 上 eframe 关掉 default-features 后必须显式开 x11/wayland，
# 否则 winit 找不到窗口后端。用 target 限定，不影响 Windows 构建。
[target.'cfg(target_os = "linux")'.dependencies]
eframe = { version = "0.37", default-features = false, features = ["glow", "default_fonts", "x11", "wayland"] }

[dependencies]
mojuan-core = { path = "../core" }
eframe = { version = "0.37", default-features = false, features = ["glow", "default_fonts"] }
egui = "0.37"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
rfd = "0.18"
raw-window-handle = "0.6"
